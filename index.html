<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svet Lego junakov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --yellow: #FFCF00;
    --red: #E3000B;
    --orange: #F7861E;
    --orange-dark: #D96D0A;
    --blue: #006CB7;
    --ink: #1B1B1F;
    --muted: #6B6B73;
    --line: #E6E6EA;
    --bg: #FFFFFF;
    --panel: #F6F6F8;
    --tile: #F2F2F4;
    --radius: 16px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Outfit', 'Segoe UI', sans-serif;
    color: var(--ink);
    background: var(--bg);
}

button { font-family: inherit; cursor: pointer; }

/* --- GLAVA --- */
header {
    background: var(--yellow);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 28px;
    flex-shrink: 0;
}
.logo {
    width: 56px;
    height: 56px;
    background: var(--red);
    border-radius: 6px;
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 3px #fff, 0 0 0 2px var(--ink);
    flex-shrink: 0;
}
.logo svg { width: 34px; height: 34px; }
header h1 {
    margin: 0;
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-transform: uppercase;
}
.header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}
.pill-btn {
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    transition: background .15s;
}
.pill-btn:hover { background: rgba(0,0,0,.08); }
.pill-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.pill-btn.solid { background: var(--ink); color: #fff; }
.pill-btn.solid:hover { background: #333; }

/* --- VRTILJAK FIGURIC --- */
.carousel-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 28px 0;
    background: var(--panel);
}
.carousel-head .hint { margin-left: auto; color: var(--muted); font-size: .95rem; }
.carousel {
    position: relative;
    overflow: hidden;
    background: var(--panel);
    padding: 14px 0 22px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    /* mehak prehod na robovih */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
}
.track {
    display: flex;
    gap: 14px;
    width: max-content;
    padding: 0 7px;
    will-change: transform;
}
.carousel.static { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
.carousel.static .track { padding: 0 28px; }

.fig {
    width: 150px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    transition: transform .15s, box-shadow .15s, border-color .15s;
}
.fig:hover { transform: translateY(-5px); box-shadow: 0 10px 22px rgba(0,0,0,.10); border-color: var(--yellow); }
.fig:active { transform: scale(.96); }
.fig img { width: 100%; height: 96px; object-fit: contain; mix-blend-mode: multiply; }
.fig span { font-size: .9rem; font-weight: 600; line-height: 1.15; }
.carousel-empty { padding: 40px 28px; color: var(--muted); font-size: 1.1rem; }

/* --- IZDELKI (drugi trak) --- */
.products-head { padding-top: 4px; }
.carousel.products { padding: 10px 0 18px; }
.prod {
    width: 190px;
    height: 140px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
}
.prod:hover { transform: translateY(-5px); box-shadow: 0 10px 22px rgba(0,0,0,.10); border-color: var(--yellow); }
.prod img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
[hidden] { display: none !important; }

/* --- OBVESTILO --- */
.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100;
    max-width: calc(100vw - 32px);
    text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* --- AKTIVNE IZPOSOJE --- */
.stage { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }

.section-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 16px;
    font-size: 1.6rem;
    font-weight: 700;
}
.section-title .count { font-size: 1rem; font-weight: 500; color: var(--muted); }
.carousel-head .section-title { margin: 0; font-size: 1.35rem; }

#rental-list {
    display: grid;
    gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min, 190px), 1fr));
}
/* Višina slike glede na zaslon, da kartice ne gredo čez rob */
#rental-list.size-l { --card-min: 300px; --img-h: 20vh; grid-template-columns: repeat(auto-fill, minmax(300px, 380px)); }
#rental-list.size-m { --card-min: 220px; --img-h: 17vh; }
#rental-list.size-s { --card-min: 170px; --img-h: 12vh; }

@keyframes popIn { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

.card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
}
.card.new { animation: popIn .4s cubic-bezier(.175,.885,.32,1.275); }
.card.expired { border: 2px solid var(--red); }

.card-img {
    background: var(--tile);
    border-radius: 12px;
    height: var(--img-h, 20vh);
    position: relative;
    margin-bottom: 12px;
}
/* multiply: bela ozadja fotografij se zlijejo s sivo ploščico */
.card-img img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; mix-blend-mode: multiply; }

.badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--yellow);
    color: var(--ink);
    font-weight: 600;
    font-size: .8rem;
    padding: 3px 10px;
    border-radius: 6px;
}
.card.expired .badge { background: var(--red); color: #fff; }

.student { font-weight: 700; line-height: 1.1; font-size: 1.5rem; overflow-wrap: anywhere; }
.char-name { color: var(--muted); font-size: 1rem; margin-top: 2px; }

.card-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.timer {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    letter-spacing: .02em;
}
.timer.low { color: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .45; } }
.return-btn {
    margin-left: auto;
    border: none;
    background: var(--orange);
    color: #fff;
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 1rem;
    font-weight: 600;
}
.return-btn:hover { background: var(--orange-dark); }

/* Velike kartice, ko se igra le nekaj otrok */
.size-l .student { font-size: 2rem; }
.size-l .char-name { font-size: 1.2rem; }
.size-l .timer { font-size: 2.1rem; }
.size-l .return-btn { font-size: 1.15rem; padding: 12px 26px; }
.size-s .student { font-size: 1.2rem; }
.size-s .char-name { font-size: .85rem; }
.size-s .timer { font-size: 1.2rem; }
.size-s .return-btn { padding: 7px 14px; font-size: .9rem; }

.empty {
    grid-column: 1 / -1;
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
}
.empty strong { display: block; color: var(--ink); font-size: 1.4rem; margin-bottom: 6px; }

/* --- HITER VNOS IMENA --- */
dialog {
    border: none;
    border-radius: 20px;
    padding: 0;
    width: min(420px, calc(100vw - 32px));
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
    font-family: inherit;
    color: var(--ink);
}
dialog[open] { animation: popIn .25s cubic-bezier(.175,.885,.32,1.275); }
dialog::backdrop { background: rgba(27,27,31,.45); }
.dlg-fig {
    background: var(--tile);
    height: 200px;
    position: relative;
}
.dlg-fig img { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); object-fit: contain; mix-blend-mode: multiply; }
.dlg-body { padding: 18px 22px 22px; }
.dlg-char { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; }
.dlg-input {
    width: 100%;
    font: inherit;
    font-size: 1.3rem;
    padding: 12px 18px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    outline: none;
}
.dlg-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,108,183,.25); }
.dlg-actions { display: flex; gap: 10px; margin-top: 14px; }
.dlg-actions .start {
    flex: 1;
    border: none;
    background: var(--orange);
    color: #fff;
    border-radius: 999px;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 600;
}
.dlg-actions .start:hover { background: var(--orange-dark); }
.dlg-actions .cancel {
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 600;
}

/* --- OKNO Z VSEMI FIGURICAMI --- */
#grid-dialog { width: min(1200px, calc(100vw - 48px)); max-height: calc(100vh - 48px); }
.grid-head {
    display: flex;
    align-items: center;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 1;
}
.grid-head h2 { margin: 0; font-size: 1.5rem; }
.grid-head .close {
    margin-left: auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fff;
    font-size: 1.1rem;
}
.grid-head .close:hover { background: var(--tile); }
#grid-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    padding: 18px 22px 22px;
    background: var(--panel);
}
#grid-list .fig { width: auto; }
#grid-list .fig img { height: 100px; }

/* --- PRIJAVA --- */
.login-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.login-body h2 { margin: 0; font-size: 1.4rem; }
.login-body p { margin: 0; color: var(--muted); font-size: .95rem; }
.login-msg { color: var(--red) !important; min-height: 1.2em; }

/* --- POVEČAN IZDELEK --- */
#photo-dialog { width: min(900px, calc(100vw - 32px)); }
.photo-big { background: #fff; height: min(70vh, 640px); position: relative; }
.photo-big img { position: absolute; inset: 16px; width: calc(100% - 32px); height: calc(100% - 32px); object-fit: contain; mix-blend-mode: multiply; }
.photo-foot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
.photo-foot .date { color: var(--muted); }
.photo-foot .del {
    margin-left: auto;
    border: 2px solid var(--red);
    color: var(--red);
    background: #fff;
    border-radius: 999px;
    padding: 9px 18px;
    font-weight: 600;
    font-size: 1rem;
}
.photo-foot .del:hover { background: #fdeceb; }
.photo-foot .cancel { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 1rem; }

/* --- MANJŠI ZASLONI --- */
@media (max-width: 820px) {
    body { height: auto; overflow: auto; }
    header { padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.3rem; }
    .logo { width: 44px; height: 44px; }
    .header-actions { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 8px; }
    .pill-btn { padding: 8px 14px; font-size: .95rem; }
    .carousel-head { padding: 16px 16px 0; }
    .carousel-head .hint { display: none; }
    .fig { width: 120px; }
    .fig img { height: 86px; }
    .stage { overflow: visible; padding: 22px 16px 40px; }
}
</style>
</head>
<body>

<header>
    <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 40 40"><rect x="4" y="14" width="32" height="20" rx="3" fill="#fff"/><rect x="8" y="8" width="9" height="7" rx="2" fill="#fff"/><rect x="23" y="8" width="9" height="7" rx="2" fill="#fff"/></svg>
    </div>
    <h1>Svet Lego junakov</h1>
    <div class="header-actions">
        <button class="pill-btn solid" id="photo-btn" onclick="startPhoto()">📷 Dodaj izdelek</button>
        <button class="pill-btn solid" id="grid-btn" onclick="openGrid()">▦ Vse figurice</button>
        <button class="pill-btn solid" id="random-btn" onclick="openRandom()">🎲 Naključna figurica</button>
        <button class="pill-btn" id="return-all" onclick="returnAll()">Vrni vse ↺</button>
    </div>
</header>

<div class="carousel-head">
    <h2 class="section-title">Figurice <span class="count" id="char-count"></span></h2>
    <span class="hint">Z miško ustaviš trak · klikni figurico</span>
</div>
<div class="carousel" id="carousel">
    <div class="track" id="track"></div>
</div>

<div id="products-section" hidden>
    <div class="carousel-head products-head">
        <h2 class="section-title">Naši izdelki <span class="count" id="prod-count"></span></h2>
    </div>
    <div class="carousel products" id="prod-carousel">
        <div class="track" id="prod-track"></div>
    </div>
</div>

<section class="stage">
    <h2 class="section-title">Igra se zdaj <span class="count" id="rental-count"></span></h2>
    <div id="rental-list"></div>
</section>

<dialog id="grid-dialog">
    <div class="grid-head">
        <h2>Izberi figurico</h2>
        <button type="button" class="close" id="grid-close" title="Zapri">✕</button>
    </div>
    <div id="grid-list"></div>
</dialog>

<dialog id="login-dialog">
    <form class="login-body" id="login-form">
        <h2>Prijava za učitelje</h2>
        <p>Enak e-naslov in geslo kot pri Brihta-MAT. Prijaviš se samo enkrat na tej napravi.</p>
        <input class="dlg-input" id="login-email" type="email" autocomplete="username" placeholder="E-naslov" required>
        <input class="dlg-input" id="login-pass" type="password" autocomplete="current-password" placeholder="Geslo" required>
        <p class="login-msg" id="login-msg"></p>
        <div class="dlg-actions">
            <button type="button" class="cancel" id="login-cancel">Prekliči</button>
            <button type="submit" class="start" id="login-submit">Prijava</button>
        </div>
    </form>
</dialog>

<dialog id="photo-dialog">
    <div class="photo-big"><img id="photo-img" alt="Izdelek"></div>
    <div class="photo-foot">
        <span class="date" id="photo-date"></span>
        <button type="button" class="del" id="photo-del">Izbriši</button>
        <button type="button" class="cancel" id="photo-close">Zapri</button>
    </div>
</dialog>

<!-- brez "capture": telefon ponudi kamero ali galerijo; "multiple" za več slik iz galerije -->
<input type="file" id="photo-input" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status"></div>

<dialog id="name-dialog">
    <form method="dialog" id="name-form">
        <div class="dlg-fig"><img id="dlg-img" alt=""></div>
        <div class="dlg-body">
            <p class="dlg-char" id="dlg-char"></p>
            <input class="dlg-input" id="dlg-input" list="known-names" autocomplete="off" placeholder="Ime učenca" required>
            <datalist id="known-names"></datalist>
            <div class="dlg-actions">
                <button type="button" class="cancel" id="dlg-cancel">Prekliči</button>
                <button type="submit" class="start">Začni igro ▶</button>
            </div>
        </div>
    </form>
</dialog>

<script>
// --- KONFIGURACIJA PODATKOV ---
// Slike so v mapi "figurice" poleg te datoteke; ime figurice = ime datoteke.
const characterNames = [
    "Agent Simon", "Agent Vasja", "Bradač", "Dirkač Leo", "Gabi", "Jošt Kapičar",
    "Kockasti Zombi", "Kopač Jože", "Krotilec zmajev", "Leopold pametnjakovič", "Lovilec zmajev",
    "Nejc", "Nika", "Pero", "Pika", "Policist Marko", "Policist Peter", "Raziskovalec Robi",
    "Rdeči dirkač", "Robotek Rogatež", "Robotko kvadratnik", "Sončica Maša", "Strela", "Suljko",
    "Čeden Miki", "Črni napadalec"
];
const characters = characterNames.map(name => ({
    id: name,
    name,
    img: encodeURI(`figurice/${name}.png`) // presledki in šumniki v URL-ju
}));

const RENTAL_TIME_MINUTES = 15;
const MAX_KNOWN_NAMES = 60;
const CAROUSEL_SPEED = 45; // slikovnih pik na sekundo

// Nadomestna slika (rumena Lego kocka), če slike figurice ni mogoče naložiti
const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">' +
    '<rect x="14" y="8" width="12" height="8" rx="2" fill="#e6b800"/>' +
    '<rect x="34" y="8" width="12" height="8" rx="2" fill="#e6b800"/>' +
    '<rect x="8" y="14" width="44" height="38" rx="4" fill="#FFCF00"/>' +
    '<text x="30" y="41" font-size="22" text-anchor="middle" fill="#8a7400" font-family="sans-serif" font-weight="bold">?</text>' +
    '</svg>');

// --- STANJE APLIKACIJE ---
let state = { rentals: [] };   // [{ id, char, student, endTime }]
let knownNames = [];           // prej vpisana imena (za samodejno dopolnjevanje)
let newRentalIds = new Set();
let pendingChar = null;        // figurica, za katero vpisujemo ime

const $ = id => document.getElementById(id);

function makeId(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text != null) e.textContent = text; // textContent: vpisana imena so varna
    return e;
}

function setImg(img, src) {
    img.onerror = () => { img.onerror = null; img.src = FALLBACK_IMG; };
    img.src = src;
    return img;
}

function availableChars() {
    const rented = new Set(state.rentals.map(r => r.char.id));
    return characters.filter(c => !rented.has(c.id));
}

// --- VRTILJAK ---
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Trak, ki se neskončno vrti; dir = 1 (od leve proti desni) ali -1
function makeCarousel(box, track, dir) {
    const c = { offset: 0, setWidth: 0, hovering: false };
    box.addEventListener('mouseenter', () => { c.hovering = true; });
    box.addEventListener('mouseleave', () => { c.hovering = false; });

    c.fill = (items, makeCard, emptyText) => {
        track.innerHTML = '';
        if (items.length === 0) {
            c.setWidth = 0;
            if (emptyText) track.appendChild(el('div', 'carousel-empty', emptyText));
            return;
        }
        items.forEach(it => track.appendChild(makeCard(it)));
        if (reduceMotion) { box.classList.add('static'); return; }

        // Širina enega kompleta (vključno z razmikom), nato toliko kopij, da trak vedno pokrije zaslon
        const cs = getComputedStyle(track);
        const gap = parseFloat(cs.columnGap) || 0;
        c.setWidth = track.scrollWidth - parseFloat(cs.paddingLeft) * 2 + gap;
        const copies = Math.ceil(box.clientWidth / c.setWidth) + 1;
        for (let i = 0; i < copies; i++) items.forEach(it => track.appendChild(makeCard(it)));
        c.offset %= c.setWidth;
    };

    c.step = (dt, paused) => {
        if (c.setWidth > 0 && !paused && !c.hovering && !reduceMotion)
            c.offset = (c.offset + CAROUSEL_SPEED * dt) % c.setWidth;
        track.style.transform = c.setWidth > 0 && !reduceMotion
            ? `translateX(${dir > 0 ? c.offset - c.setWidth : -c.offset}px)` : '';
    };
    return c;
}

const figCarousel = makeCarousel($('carousel'), $('track'), 1);
const prodCarousel = makeCarousel($('prod-carousel'), $('prod-track'), -1);

function figCard(char, onPick = openDialog) {
    const card = el('button', 'fig');
    card.type = 'button';
    card.onclick = () => onPick(char);
    const img = el('img');
    img.alt = '';
    card.append(setImg(img, char.img), el('span', null, char.name));
    return card;
}

function renderCarousel() {
    const free = availableChars();
    $('char-count').textContent = `${free.length} / ${characters.length} prostih`;
    figCarousel.fill(free, c => figCard(c), 'Vse figurice so izposojene. 🎉');
}

let lastTime = null;
function tick(t) {
    const dt = lastTime == null ? 0 : (t - lastTime) / 1000;
    lastTime = t;

    figCarousel.step(dt, dialogOpen);
    prodCarousel.step(dt, dialogOpen);
    requestAnimationFrame(tick);
}

// schema: "lego" za izdelke, "public" za prijavo (ista kot pri Brihta-MAT)
async function rpc(fn, params, schema = 'lego') {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
            method: 'POST',
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Content-Profile': schema
            },
            body: JSON.stringify(params || {})
        });
        if (!res.ok) return null;
        const txt = await res.text();
        return txt ? JSON.parse(txt) : null;
    } catch (e) { return null; }
}

function toast(msg, ms = 2600) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), ms);
}

// --- IZDELKI ---
let products = [];            // [{ id, created_at }] najnovejši najprej
const productImages = {};     // id -> data URL

let productsLoadSeq = 0;
async function loadProducts() {
    // Odgovor starejšega klica (npr. rednega preverjanja) ne sme prepisati novejšega
    const seq = ++productsLoadSeq;
    const list = await rpc('seznam');
    if (seq !== productsLoadSeq) return;
    if (!Array.isArray(list)) return; // baza nedosegljiva ali SQL še ni zagnan
    const missing = list.map(p => p.id).filter(id => !productImages[id]);
    for (let i = 0; i < missing.length; i += 10) {
        const rows = await rpc('slike', { p_ids: missing.slice(i, i + 10) });
        (Array.isArray(rows) ? rows : []).forEach(r => { productImages[r.id] = r.image; });
    }
    if (seq !== productsLoadSeq) return;
    const next = list.filter(p => productImages[p.id]);
    // Trak na novo izrišemo samo, če se je kaj spremenilo
    if (next.map(p => p.id).join() !== products.map(p => p.id).join()) {
        products = next;
        renderProducts();
    }
}

$('photo-input').addEventListener('change', async () => {

    let added = 0, failed = 0;

function loadImage(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('slika')); };
        img.src = url;
    });
}

// Pomanjša sliko in pobeli list: barvo papirja ob robu raztegne čez belo
async function prepareImage(file) {
    const img = await loadImage(file);
    const MAX = 1000;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const px = ctx.getImageData(0, 0, w, h);
    const d = px.data;
    // Mediana vsake barve v 5 % pasu ob robu = barva lista
    const border = Math.max(2, Math.round(Math.min(w, h) * 0.05));
    const samples = [[], [], []];
    for (let y = 0; y < h; y += 3) {
        for (let x = 0; x < w; x += 3) {
            if (x >= border && x < w - border && y >= border && y < h - border) continue;
            const i = (y * w + x) * 4;
            samples[0].push(d[i]); samples[1].push(d[i + 1]); samples[2].push(d[i + 2]);
        }
    }
    const gain = samples.map(arr => {
        arr.sort((a, b) => a - b);
        const paper = arr[Math.floor(arr.length / 2)] || 255;
        // malo čez belo, da se tudi rahle sence na listu porežejo v čisto belo
        return Math.min(2.4, Math.max(1, 268 / paper));
    });
    for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * gain[0]);
        d[i + 1] = Math.min(255, d[i + 1] * gain[1]);
        d[i + 2] = Math.min(255, d[i + 2] * gain[2]);
    }
    ctx.putImageData(px, 0, 0);

    let q = 0.82, out = canvas.toDataURL('image/jpeg', q);
    while (out.length > 500000 && q > 0.5) { q -= 0.1; out = canvas.toDataURL('image/jpeg', q); }
    return out;
}

// --- IZPOSOJE ---
function startRental(student, char) {
    if (state.rentals.some(r => r.char.id === char.id)) return;
    const id = makeId('r');
    newRentalIds.add(id);
    state.rentals.unshift({
        id, char, student,
        endTime: new Date(Date.now() + RENTAL_TIME_MINUTES * 60 * 1000)
    });
    rememberName(student);
    render();
}

function returnChar(id) {
    state.rentals = state.rentals.filter(r => r.id !== id);
    render();
}

function returnAll() {
    if (state.rentals.length === 0) return;
    if (confirm("Ali si prepričan, da želiš končati igro za vse učence?")) {
        state.rentals = [];
        render();
    }
}

// --- IZRIS ---
function render() {
    renderCarousel();
    renderRentals();
    renderKnownNames();
    saveState();
}

function renderRentals() {
    const list = $('rental-list');
    const count = state.rentals.length;
    list.className = count <= 2 ? 'size-l' : (count <= 8 ? 'size-m' : 'size-s');
    list.innerHTML = '';
    $('rental-count').textContent = count ? `${count}` : '';
    $('return-all').disabled = count === 0;
    $('random-btn').disabled = count === characters.length;
    $('grid-btn').disabled = count === characters.length;

    if (count === 0) {
        const empty = el('div', 'empty');
        empty.append(el('strong', null, 'Nihče se še ne igra'), 'Klikni figurico na traku zgoraj in vpiši ime.');
        list.appendChild(empty);
        return;
    }

    state.rentals.forEach(rental => {
        const remains = secondsLeft(rental);
        const card = el('div', 'card' + (newRentalIds.has(rental.id) ? ' new' : '') + (remains <= 0 ? ' expired' : ''));
        card.dataset.id = rental.id;

        const imgBox = el('div', 'card-img');
        const img = el('img');
        img.alt = '';
        imgBox.appendChild(setImg(img, rental.char.img));
        const badge = el('span', 'badge', remains <= 0 ? 'Konec' : 'Igra');

        const foot = el('div', 'card-foot');
        const timer = el('span', 'timer' + (remains > 0 && remains < 60 ? ' low' : ''), formatTime(remains));
        const ret = el('button', 'return-btn', 'Vrni');
        ret.onclick = () => returnChar(rental.id);
        foot.append(timer, ret);

        card.append(imgBox, badge, el('div', 'student', rental.student), el('div', 'char-name', rental.char.name), foot);
        list.appendChild(card);
    });
    newRentalIds.clear();
}

function renderKnownNames() {
    const dl = $('known-names');
    dl.innerHTML = '';
    knownNames.forEach(n => { const o = el('option'); o.value = n; dl.appendChild(o); });
}

function secondsLeft(rental) {
    return Math.max(0, Math.floor((new Date(rental.endTime) - Date.now()) / 1000));
}

function formatTime(sec) {
    if (sec <= 0) return "KONEC!";
    return `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, '0')}`;
}

// --- Osveži samo čas, ne slik ---
setInterval(() => {
    state.rentals.forEach(rental => {
        const card = document.querySelector(`.card[data-id="${rental.id}"]`);
        if (!card) return;
        const remains = secondsLeft(rental);
        const timer = card.querySelector('.timer');
        timer.textContent = formatTime(remains);
        timer.classList.toggle('low', remains > 0 && remains < 60);
        card.classList.toggle('expired', remains <= 0);
        card.querySelector('.badge').textContent = remains <= 0 ? 'Konec' : 'Igra';
    });
}, 1000);

// --- SHRANJEVANJE V POMNILNIK BRSKALNIKA ---
function saveState() {
    try {
        localStorage.setItem('legoState2', JSON.stringify({ rentals: state.rentals }));
        localStorage.setItem('legoNames', JSON.stringify(knownNames));
    } catch (e) { /* npr. zasebno okno – igra deluje tudi brez shranjevanja */ }
}

function loadState() {
    const byId = Object.fromEntries(characters.map(c => [c.id, c]));
    try {
        knownNames = JSON.parse(localStorage.getItem('legoNames')) || [];
    } catch (e) { knownNames = []; }
    try {
        // Novo stanje, sicer staro (pred posodobitvijo) – izposoje se ohranijo
        const saved = JSON.parse(localStorage.getItem('legoState2') || localStorage.getItem('legoState') || 'null');
        if (!saved) return;
        const seen = new Set();
        state.rentals = (saved.rentals || [])
            .filter(r => r.char && byId[r.char.id] && r.student && !seen.has(r.char.id) && seen.add(r.char.id))
            .map(r => ({ ...r, id: String(r.id), char: byId[r.char.id] }));
    } catch (e) { /* pokvarjeno shranjeno stanje – začni znova */ }
}
